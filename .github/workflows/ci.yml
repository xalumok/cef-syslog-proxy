name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned deliberately. A Vector bump is a code change: it runs the full pipeline,
  # including the CEF conformance corpus. No dependency-bot auto-merge for the data plane.
  VECTOR_VERSION: "0.51.0"

jobs:
  quality:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy src/sixthsense

      - name: Types (compiler, strict)
        # The compiler turns analyst input into executable config. Strict typing here is
        # the cheapest defense against the injection surface in D-44.
        run: mypy --strict src/sixthsense/compiler

      - name: Install Vector ${{ env.VECTOR_VERSION }}
        # Publishing runs the validation gate, which shells out to `vector vrl`. Without the
        # binary the bundle tests fail rather than skip, and skipping them would leave publish
        # and rollback untested in CI: the dataplane job only runs the e2e module.
        run: |
          curl -sSfL "https://packages.timber.io/vector/${VECTOR_VERSION}/vector-${VECTOR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o vector.tar.gz
          tar xzf vector.tar.gz
          echo "$PWD/vector-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Unit and property tests
        run: pytest tests -q --ignore=tests/test_dataplane_e2e.py

  dataplane:
    name: end-to-end against real Vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"

      - name: Install Vector ${{ env.VECTOR_VERSION }}
        run: |
          curl -sSfL "https://packages.timber.io/vector/${VECTOR_VERSION}/vector-${VECTOR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o vector.tar.gz
          tar xzf vector.tar.gz
          echo "$PWD/vector-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Verify Vector
        run: vector --version

      - name: End-to-end tests
        # These prove the design rather than the code: real drops, byte-identical
        # forwarding, fail-open on unparseable input, and zero packet loss across a reload.
        run: pytest tests/test_dataplane_e2e.py -q

  security:
    name: security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system -e ".[dev]"

      - name: SAST
        run: bandit -r src/sixthsense -ll

      - name: Dependency vulnerabilities
        # Audit the declared dependencies. Auditing the environment fails under --strict
        # because the package itself is installed editable and is not on PyPI.
        run: pip-audit --strict .

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui:
    name: ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency vulnerabilities
        run: npx --yes osv-scanner@latest scan --lockfile=package-lock.json || true

  image:
    name: build, scan, sign
    runs-on: ubuntu-latest
    needs: [quality, dataplane, security, ui]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # `--pull` on both builds. A cached python:3.12-slim is how a base layer with a
      # published fix goes on shipping unnoticed, and the blocking scan below only helps if
      # the layer it scans is the current one.
      - name: Build control plane image
        run: docker build --pull -f deploy/Dockerfile.control --build-arg VECTOR_VERSION=${VECTOR_VERSION} -t sixthsense-control:${{ github.sha }} .

      - name: Build node image
        run: docker build --pull -f deploy/Dockerfile.node --build-arg VECTOR_VERSION=${VECTOR_VERSION} -t sixthsense-node:${{ github.sha }} .

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: sixthsense-node:${{ github.sha }}
          format: cyclonedx-json
          # The SBOM must cover the Vector binary too. One that lists only pip
          # dependencies misrepresents what actually ships.
          artifact-name: sbom-node.cdx.json

      - name: Container scan, control plane
        # No `ignore-unfixed`. Both images build on python:3.12-alpine, which scans with
        # zero HIGH or CRITICAL findings, so a strict gate passes today and any finding at
        # all is news. The 23 unfixable Debian CVEs that used to fail this step were dealt
        # with by changing the base image, not by filtering the scanner.
        #
        # If an unfixable CVE does land in Alpine later, add a dated, per-CVE `.trivyignore`
        # entry with the reachability argument written out. Do not reach for
        # `ignore-unfixed` — a blanket flag hides the next one too.
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: sixthsense-control:${{ github.sha }}
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"

      - name: Container scan, node
        # The node image sits in the data path and ships the Vector binary, so it gets the
        # same gate. Scanning only the control plane left the image that actually receives
        # events unscanned.
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: sixthsense-node:${{ github.sha }}
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign
        run: echo "cosign sign --yes <registry>/sixthsense-control:${{ github.sha }}"
